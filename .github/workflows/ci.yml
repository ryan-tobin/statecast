name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
